name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'adopt'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./android/gradlew || echo "gradlew not found, will use system gradle"

    - name: Build Debug APK
      run: cd android && gradle assembleDebug

    - name: Build Release APK
      run: cd android && gradle assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: linnan-encrypted-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: linnan-encrypted-release
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Generate SHA-256
      if: success()
      run: |
        echo "Debug APK SHA-256:"
        sha256sum android/app/build/outputs/apk/debug/app-debug.apk
        echo "Release APK SHA-256:"
        sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk
